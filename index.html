<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Dark by default; the island's theme button updates both (src/features/island/helpers/theme.ts). -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#040102" />
    <script>
      // before first paint, so a saved light theme never flashes dark
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="color-scheme"]').content = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#1a84c4'
        }
      } catch {}
    </script>
    <!-- replaced in the chosen language by src/i18n/index.ts -->
    <title>YouTube Family · хто заплатив</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
